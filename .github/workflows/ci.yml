name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Go engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: C bridge test
        run: |
          go build -buildmode=c-archive -o build/libmactyper.a .
          cc -Wall -Werror -I build -I . tests/bridge_test.c build/libmactyper.a -lpthread -o build/bridge-test
          build/bridge-test
      - name: Build Windows app
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go vet ./cmd/mactyper-windows
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" \
              -o dist/MacTyper-windows-$arch.exe ./cmd/mactyper-windows
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MacTyper-windows
          path: dist/MacTyper-windows-*.exe

  windows:
    name: Tests (Windows)
    # Windows 运行器按更高倍率计费，只在 Actions 页面手动触发时运行。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./internal/... ./typos/... ./cmd/...
      - run: go build -ldflags "-H windowsgui" -o MacTyper.exe ./cmd/mactyper-windows

  macos:
    name: App (macOS)
    # macOS 运行器按更高倍率计费，只在 Actions 页面手动触发（Run workflow）时运行。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -race ./...
      - name: Build engine library
        run: go build -buildmode=c-archive -o build/libmactyper.a .
      - name: Build app
        run: |
          clang -fobjc-arc -Wall -I build -I . app/MacTyperGUI/*.m build/libmactyper.a \
            -framework Cocoa -framework ApplicationServices -framework Carbon -framework CoreFoundation -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -framework CoreVideo -o build/MacTyper
      - name: GUI and bridge tests
        run: |
          clang -fobjc-arc -Wall -I build -I . -I app/MacTyperGUI tests/gui_test.m app/MacTyperGUI/MT*.m build/libmactyper.a \
            -framework Cocoa -framework ApplicationServices -framework Carbon -framework CoreFoundation -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -framework CoreVideo -o build/gui-test
          build/gui-test
          clang -Wall -I build -I . tests/bridge_test.c build/libmactyper.a \
            -framework CoreFoundation -framework ApplicationServices -o build/bridge-test
          build/bridge-test
