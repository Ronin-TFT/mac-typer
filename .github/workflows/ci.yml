name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -race ./...
      - name: Build helper
        run: go build -o /tmp/mac-typer .
      - name: Build GUI
        run: clang -fobjc-arc -Wall app/MacTyperGUI/main.m -framework Cocoa -framework ApplicationServices -framework Carbon -o /tmp/MacTyper
      - name: GUI regression tests
        run: |
          clang -fobjc-arc tests/gui_test.m -framework Cocoa -framework ApplicationServices -framework Carbon -o /tmp/mactyper-gui-test
          /tmp/mactyper-gui-test
